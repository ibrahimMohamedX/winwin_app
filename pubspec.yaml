name: WinWin
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  animate_do: ^4.2.0
  animated_botton_navigation: ^0.0.8
  carousel_slider: ^5.1.2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.1
  flutter:
    sdk: flutter
  flutter_countdown_timer: ^4.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.3
  go_router: ^17.0.1
  lottie: ^3.3.2
  phone_form_field: ^10.0.17
  shared_preferences: ^2.5.4
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/shapes/

  fonts:
    - family: SchylerRaleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/play_store.png

  adaptive_icon_foreground: assets/icons/play_store.png

flutter_native_splash:
  android: true
  ios: true
  color: "#FFFFFF"
  image: assets/icons/play_store.png
  android_12:
    color: "#FFFFFF"
    image: assets/icons/play_store.png
